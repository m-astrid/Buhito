services:
  api:
    build:
      dockerfile: Dockerfile.api
    environment:
      - DB_PATH=/data/mini-owl.db
      - GRPC_ADDR=:50051
    volumes:
      - owl-data:/data
    restart: unless-stopped

  bot:
    build:
      dockerfile: Dockerfile.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GRPC_ADDR=api:50051
    depends_on:
      - api
    restart: unless-stopped

volumes:
  owl-data:
